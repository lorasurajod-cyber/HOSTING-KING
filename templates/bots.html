{% extends "dashboard_base.html" %}
{% block content %}
<h2>My Bots</h2>
{% if not bots %}
<p class="sub">No bots yet.</p>
<a class="btn btn-primary" href="{{ url_for('upload') }}">Upload Bot</a>
{% else %}
{% for b in bots %}
  <a class="card" href="{{ url_for('bot_detail', bot_id=b.id) }}" style="display:block;margin-bottom:0.75rem;text-decoration:none;color:inherit">
    <strong>{{ b.name }}</strong>
    <div class="sub">{{ b.status }} · {{ b.kind }}</div>
  </a>
{% endfor %}
{% endif %}
{% endblock %}
