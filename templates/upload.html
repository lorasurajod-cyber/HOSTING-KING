{% extends "dashboard_base.html" %}
{% block content %}
<h2>Upload Bot</h2>
<form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data" class="card" style="max-width:480px">
  <div class="form-group"><label>Bot name</label><input class="form-control" name="name" required></div>
  <div class="form-group"><label>File</label><input class="form-control" type="file" name="file" required accept=".py,.zip"></div>
  <button class="btn btn-primary" type="submit">Upload & Host</button>
</form>
{% endblock %}
